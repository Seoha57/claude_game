<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a30"/>
      <stop offset="1" stop-color="#1a1416"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5cf6a"/>
      <stop offset="1" stop-color="#b06030"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (safe for maskable) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- Card frame within safe area (centered, 80% of canvas) -->
  <rect x="80" y="56" width="352" height="400" rx="36" fill="none" stroke="#d4a05b" stroke-width="10" opacity="0.85"/>
  <text x="256" y="310"
        text-anchor="middle"
        font-family="Trebuchet MS, Segoe UI, Arial, sans-serif"
        font-size="180"
        font-weight="900"
        fill="url(#gold)"
        stroke="#7a3a18"
        stroke-width="4">DnC</text>
</svg>
